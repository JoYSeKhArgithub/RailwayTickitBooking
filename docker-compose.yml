name: irctc-backend

networks:
  irctc-network:
    driver: bridge

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    networks:
      - irctc-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    profiles:
      - debug
    networks:
      - irctc-network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  redis:
    image: redis/redis-stack:6.2.6-v19
    container_name: redis
    restart: always
    networks:
      - irctc-network
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT}:6379"
      - "${REDIS_INSIGHT_PORT}:8001"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    networks:
      - irctc-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xms64m -Xmx128m"
    ports:
      - "${ZOOKEEPER_PORT}:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    networks:
      - irctc-network
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    profiles:
      - debug
    networks:
      - irctc-network
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: irctc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    restart: always
    networks:
      - irctc-network
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    restart: always
    profiles:
      - debug
    networks:
      - irctc-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    networks:
      - irctc-network
    ports:
      - "${API_GATEWAY_PORT}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      ALLOWED_ORIGINS: "*"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      USER_SERVICE_URL: http://user-service:8080
      ADMIN_SERVICE_URL: http://admine-pannel:6123
      SEARCH_SERVICE_URL: http://search-service:4002
      INVENTORY_SERVICE_URL: http://inventory-service:4005
      BOOKING_SERVICE_URL: http://booking-service:4008
      PAYMENT_SERVICE_URL: http://payment-service:4011
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: always
    networks:
      - irctc-network
    ports:
      - "${USER_SERVICE_PORT}:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgresDB
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: user-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  admine-pannel:
    build:
      context: .
      dockerfile: admine-pannel/Dockerfile
    container_name: admine-pannel
    restart: always
    networks:
      - irctc-network
    ports:
      - "${ADMIN_SERVICE_PORT}:6123"
    environment:
      PORT: 6123
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/admin_service_database
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: admin-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    restart: always
    networks:
      - irctc-network
    ports:
      - "${INVENTORY_SERVICE_PORT}:4005"
    environment:
      PORT: 4005
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory_service_database
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: inventory-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    restart: always
    networks:
      - irctc-network
    ports:
      - "${BOOKING_SERVICE_PORT}:4008"
    environment:
      PORT: 4008
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/booking_service_database
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: booking-service
      INVENTORY_SERVICE_URL: http://inventory-service:4005
      PAYMENT_SERVICE_URL: http://payment-service:4011
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    restart: always
    networks:
      - irctc-network
    ports:
      - "${PAYMENT_SERVICE_PORT}:4011"
    environment:
      PORT: 4011
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment_service_database
      KAFKA_BROKERS: kafka:9092
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: payment-service
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  search-service:
    build:
      context: .
      dockerfile: search-service/Dockerfile
    container_name: search-service
    restart: always
    networks:
      - irctc-network
    ports:
      - "${SEARCH_SERVICE_PORT}:4002"
    environment:
      PORT: 4002
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: always
    networks:
      - irctc-network
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:4004"
    environment:
      PORT: 4004
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=192"
      LOG_LEVEL: info
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      MAIL_SEND: ${MAIL_SEND}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  elasticsearch_data: